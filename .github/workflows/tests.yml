name: Tests

on:
  push:
    branches: [main, '2.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel_name }} / Passport ${{ matrix.passport }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel_name: '11'
            laravel: '^11.35'
            passport: '^12.0'
            testbench: '^9.15'
            pest: '^3.0'
            phpunit: '^11.0'
            allow_insecure_framework_solve: true
          - php: '8.2'
            laravel_name: '11'
            laravel: '^11.35'
            passport: '^13.0'
            testbench: '^9.15'
            pest: '^3.0'
            phpunit: '^11.0'
            allow_insecure_framework_solve: true
          - php: '8.2'
            laravel_name: '12'
            laravel: '^12.0'
            passport: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
            phpunit: '^11.0'
            allow_insecure_framework_solve: false
          - php: '8.2'
            laravel_name: '12'
            laravel: '^12.0'
            passport: '^13.0'
            testbench: '^10.0'
            pest: '^3.0'
            phpunit: '^11.0'
            allow_insecure_framework_solve: false
          - php: '8.3'
            laravel_name: '12'
            laravel: '^12.0'
            passport: '^12.0'
            testbench: '^10.0'
            pest: '^3.0'
            phpunit: '^11.0'
            allow_insecure_framework_solve: false
          - php: '8.3'
            laravel_name: '12'
            laravel: '^12.0'
            passport: '^13.0'
            testbench: '^10.0'
            pest: '^3.0'
            phpunit: '^11.0'
            allow_insecure_framework_solve: false
          - php: '8.3'
            laravel_name: '13'
            laravel: '^13.0'
            passport: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            phpunit: '^12.0'
            allow_insecure_framework_solve: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo, sqlite, pdo_sqlite, redis
          coverage: none

      - name: Install Redis for independent-process acceptance tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Allow Laravel 11 compatibility solve
        if: ${{ matrix.allow_insecure_framework_solve }}
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: |
          composer update \
            --with laravel/framework:${{ matrix.laravel }} \
            --with laravel/passport:${{ matrix.passport }} \
            --with orchestra/testbench:${{ matrix.testbench }} \
            --with pestphp/pest:${{ matrix.pest }} \
            --with phpunit/phpunit:${{ matrix.phpunit }} \
            --with-all-dependencies \
            --no-interaction \
            --prefer-dist

      - name: Validate composer manifest
        run: composer validate --strict --no-check-publish

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run Pest
        run: vendor/bin/pest

  clean-install:
    name: Clean dist / PHP 8.3 / Laravel 13 / Passport 13
    if: github.ref == 'refs/heads/2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo, sqlite, pdo_sqlite, redis, dom
          coverage: none
      - name: Install fixed candidate in an independent production dependency tree
        run: bash tests/Integration/install-dist.sh "${{ github.sha }}"
      - name: Save sanitized distribution evidence
        uses: actions/upload-artifact@v7
        with:
          name: dist-results-${{ github.sha }}
          path: /tmp/oidc-dist.*/host/dist-results.json
          if-no-files-found: error
          retention-days: 7
